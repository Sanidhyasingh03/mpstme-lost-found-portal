<div class="card" style="max-width: 450px; margin: 60px auto; padding: 40px; text-align: center;">
    <div style="margin-bottom: 20px;">
        <div style="background: #8A1538; color: white; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; margin: 0 auto; font-size: 24px; font-weight: bold;">
            A
        </div>
    </div>
    
    <h2>Admin Authentication</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 25px;">
        Please enter the administrative credential to manage campus records and claimed items.
    </p>

    <div style="text-align: left;">
        <label for="adminPass">Secure Password:</label>
        <input 
            type="password" 
            id="adminPass" 
            ng-model="adminPass" 
            placeholder="••••••••" 
            style="text-align: center; letter-spacing: 3px; font-size: 18px;"
            ng-keypress="($event.which === 13) && login()"
        >
    </div>

    <div ng-if="error" style="background: #ffebee; color: #d32f2f; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; border: 1px solid #d32f2f;">
        <strong>Access Denied:</strong> {{ error }}
    </div>

    <button ng-click="login()" style="width: 100%; padding: 15px; margin-top: 10px;">
        Authorize & Enter
    </button>
    
    <div style="margin-top: 20px;">
        <a href="#/!" style="color: #8A1538; text-decoration: none; font-size: 13px; font-weight: 600;">
            ← Return to Public Home
        </a>
    </div>
</div>
