<div class="card">
    <h2>Create Listing</h2>
    <p style="color: #2e7d32; font-weight: bold; text-align: center;">{{ successMsg }}</p>
    
    <form name="itemForm" ng-submit="itemForm.$valid && submitForm()" novalidate>
        
        <label>Report Type:</label>
        <select ng-model="item.status" required>
            <option value="Lost">Lost Item </option>
            <option value="Found">Found Item </option>
        </select>

        <label>Item Name:</label>
        <input type="text" ng-model="item.item_name" required placeholder="e.g. Blue HP Laptop, Brown Wallet">

        <label>Category:</label>
        <select ng-model="item.category" required>
            <option value="">-- Select Category --</option>
            <option value="Electronics">Electronics (Phone, Laptop, Charger)</option>
            <option value="Documents">Documents/IDs (ID Card, Hall Ticket)</option>
            <option value="Accessories">Accessories (Watch, Spectacles, Keys)</option>
            <option value="Books">Academic (Books, Journals, Stationery)</option>
            <option value="Other">Other</option>
        </select>

        <label>Detailed Description:</label>
        <textarea ng-model="item.description" required rows="3" placeholder="Mention brand, color, or specific marks that help identify the item..."></textarea>

        <label>Last Known Location / Found At:</label>
        <input type="text" ng-model="item.location" required placeholder="e.g. MPSTME Library, 4th Floor Lab">

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label>Date:</label>
                <input type="date" ng-model="item.date" required>
            </div>
            <div style="flex: 1;">
                <label>Contact Info:</label>
                <input type="text" ng-model="item.contact_info" required placeholder="Email or Phone Number">
            </div>
        </div>

        <div style="margin-top: 20px; padding: 15px; border: 1px dashed #8A1538; border-radius: 8px; background: #fff8f8;">
            <label style="margin-top: 0; color: #8A1538;">📸 Upload Item Image (Highly Recommended):</label>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Upload a clear photo to help the owner identify the item quickly.</p>
            <input type="file" id="itemImage" accept="image/*" style="border: none; padding: 0;">
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <button type="submit" ng-disabled="itemForm.$invalid" style="width: 100%; padding: 15px;">
                Add Item
            </button>
            <p ng-if="itemForm.$invalid" style="font-size: 12px; color: #d32f2f; margin-top: 10px;">
                * Please fill all required fields to enable submission.
            </p>
        </div>
    </form>
</div>
